[package]
name = "gpkg"
version = "0.3.2"
edition = "2024"
homepage = "https://github.com/cjriley9/gpkg-rs"
repository = "https://github.com/cjriley9/gpkg-rs"
license = "MIT OR Apache-2.0"
description = "Rust library for working with GeoPackages"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
geo-types = "0.7.20"
gpkg-derive = { version = "0.3.2", path = "../gpkg-derive" }
wkb = "0.9.3"
thiserror = "2.0.21"
byteorder = "1.5.0"

[dev-dependencies]
tempfile = "3.27.0"
